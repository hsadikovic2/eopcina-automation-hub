services:
  db:
    image: postgres:15
    container_name: eopcina-db
    restart: always
    environment:
      - POSTGRES_USER=eopcina_user
      - POSTGRES_PASSWORD=eopcina_password
      - POSTGRES_DB=eopcina_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eopcina_user -d eopcina_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/hsadikovic2/eopcina:latest
    container_name: eopcina-app
    restart: always
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=eopcina_db;Username=eopcina_user;Password=eopcina_password
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data: